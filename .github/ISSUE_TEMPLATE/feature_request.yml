name: Feature Request
description: Suggest an improvement for xCooler
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve xCooler.

  - type: textarea
    id: feature
    attributes:
      label: Feature
      description: What would you like xCooler to do?
      placeholder: Describe your idea.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why?
      description: Explain why this feature would be useful.
      placeholder: Explain the use case.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Add anything else that might help.
