name: Validate

on:
  push:
  pull_request:

jobs:
  powershell:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate xCooler
        shell: pwsh
        run: |
          $file = Join-Path $PWD "xCooler.ps1"

          if (-not (Test-Path $file)) {
            Write-Error "xCooler.ps1 was not found."
            exit 1
          }

          $tokens = $null
          $errors = $null

          [System.Management.Automation.Language.Parser]::ParseFile(
            $file,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            Write-Host ""
            Write-Host "PowerShell syntax errors found:" -ForegroundColor Red
            $errors | ForEach-Object {
              Write-Host $_.Message -ForegroundColor Red
            }
            exit 1
          }

          Write-Host "xCooler.ps1 syntax OK" -ForegroundColor Cyan

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop

      - name: Analyze xCooler
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer `
            -Path ".\xCooler.ps1" `
            -Severity Warning,Error

          if ($results) {
            $results | Format-Table -AutoSize

            if ($results | Where-Object Severity -eq "Error") {
              exit 1
            }
          }

          Write-Host "PSScriptAnalyzer passed." -ForegroundColor Cyan
